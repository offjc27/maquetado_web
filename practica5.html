<!DOCTYPE html> 
<!-- Indica al navegador que el documento está escrito en HTML5 -->

<html lang="es"> 
<!-- Etiqueta principal que contiene toda la página.
     lang="es" indica que el idioma del contenido es español -->

<head> 
    <!-- Contiene la configuración e información interna de la página.
         Lo que está aquí no se muestra directamente en la pantalla -->

    <meta charset="UTF-8">
    <!-- Define la codificación de caracteres.
         Permite mostrar letras como ñ, tildes y símbolos especiales -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Hace que la página se adapte al tamaño de la pantalla
         en celulares, tablets y computadores -->

    <title>Document</title>
    <!-- Define el nombre que aparece en la pestaña del navegador -->

</head>

<body>
    <!-- Contiene todo el contenido visible que verá el usuario -->
 <h1>Practica 5</h1>
    <ul>
        <!-- "ul" significa unordered list.
             Crea una lista desordenada con viñetas o puntos -->

        <li>Elemento 1</li>
        <!-- "li" significa list item.
             Representa un elemento o ítem de la lista -->

        <li>Elemento 2</li>
        <!-- Segundo elemento de la lista -->

        <li>Elemento 3</li>
        <!-- Tercer elemento de la lista -->

    </ul>
 <a href="practica8.html">volver</a>
</body>

</html>
