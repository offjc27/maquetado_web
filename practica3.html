<!DOCTYPE html> <!-- Indica que el documento está en HTML5 -->

<html lang="es"> <!-- Inicio del documento HTML y define el idioma en español -->

<head> <!-- Contiene la configuración de la página -->
    
    <meta charset="UTF-8"> 
    <!-- Permite usar caracteres especiales como ñ, tildes y símbolos -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <!-- Hace que la página se adapte a celulares, tablets y computadores -->

    <title>Document</title> 
    <!-- Nombre que aparece en la pestaña del navegador -->

</head>

<body> <!-- Aquí va todo el contenido visible de la página -->

    <!-- Título principal, el más importante -->
    <h1>Titulo principal</h1>

    <!-- Título de segundo nivel -->
    <h2>Titulo de segundo orden</h2>

    <!-- Título de tercer nivel -->
    <h3>Titulo de tercero orden</h3>

    <!-- Título de cuarto nivel -->
    <h4>Titulo de cuarto orden</h4>

    <!-- Título de quinto nivel -->
    <h5>Titulo de quinto orden</h5>

    <!-- Título de sexto nivel, el más pequeño -->
    <h6>Titulo de sexto orden</h6>

    <!-- 
    h$*6 es una abreviatura Emmet en Visual Studio Code.
    Al escribirla y presionar Tab, crea automáticamente
    desde h1 hasta h6.
    -->
 <a href="practica8.html">volver</a>
</body>
</html>
